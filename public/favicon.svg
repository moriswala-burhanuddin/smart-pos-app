<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  <!-- iOS Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#redGrad)" />
  
  <!-- Barcode + Spark Emblem -->
  <g fill="#FFFFFF" transform="translate(106, 126)">
    <!-- Barcode lines -->
    <rect x="0" y="40" width="20" height="180" rx="6" />
    <rect x="36" y="40" width="12" height="180" rx="4" />
    <rect x="64" y="40" width="28" height="180" rx="6" />
    <rect x="110" y="40" width="14" height="180" rx="4" />
    <rect x="140" y="40" width="24" height="180" rx="6" />
    <rect x="180" y="40" width="12" height="180" rx="4" />
    <rect x="208" y="40" width="32" height="180" rx="6" />
    <rect x="256" y="40" width="16" height="180" rx="4" />
    <rect x="286" y="40" width="14" height="180" rx="4" />
    
    <!-- Laser Scan Line in Crisp White / Yellow Spark -->
    <rect x="-10" y="120" width="320" height="10" rx="5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>