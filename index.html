<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SmartBill POS — Retail Scan & Bill, Dynamic UPI QR & Stock Control</title>
    
    <!-- Meta branding -->
    <meta name="description" content="Next-gen retail billing POS for shops with camera barcode scanner, amount-prefilled dynamic UPI QR, Owner PIN discount guard, and live stock tracking." />
    <meta name="theme-color" content="#DC2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartBill" />
    <link rel="icon" type="image/png" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Service Worker for real Native PWA / WebAPK install -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SmartBill Service Worker active:', reg.scope);
          }).catch(function(err) {
            console.warn('SW registration issue:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-ios-bg text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <!-- Script to remove Netlify badge/drawer if injected -->
    <script>
      (function() {
        function removeBadges() {
          var badNodes = document.querySelectorAll(
            'div[class*="netlify"], div[id*="netlify"], a[href*="netlify.com"], a[href*="netlify.app"], [data-netlify-deploy-id], [class*="netlify-badge"], iframe[src*="netlify"], #netlify-identity-widget, .netlify-feedback'
          );
          badNodes.forEach(function(node) {
            if (node && node.parentNode && node.tagName !== 'SCRIPT' && node.tagName !== 'BODY' && node.tagName !== 'HTML') {
              node.style.display = 'none';
              node.parentNode.removeChild(node);
            }
          });
          var allElements = document.getElementsByTagName('*');
          for (var i = 0; i < allElements.length; i++) {
            var el = allElements[i];
            if (el.tagName !== 'SCRIPT' && el.tagName !== 'BODY' && el.tagName !== 'HTML' && el.tagName !== 'HEAD') {
              if (el.childNodes.length === 1 && el.textContent && el.textContent.indexOf('Powered by Netlify') !== -1) {
                var target = el.closest('div') || el;
                target.style.display = 'none';
                if (target.parentNode) target.parentNode.removeChild(target);
              }
            }
          }
        }
        removeBadges();
        window.addEventListener('load', removeBadges);
        document.addEventListener('DOMContentLoaded', removeBadges);
        var obs = new MutationObserver(removeBadges);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
